<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주식 분석 로그인</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fa; color: #17212b; font-family: system-ui, sans-serif; }
        main { width: min(400px, calc(100% - 32px)); padding: 32px; background: white; border: 1px solid #dbe1e8; border-radius: 8px; }
        h1 { font-size: 23px; margin: 0 0 28px; }
        label { display: block; margin-bottom: 8px; }
        input, button { width: 100%; height: 46px; font: inherit; border-radius: 6px; }
        input { padding: 10px; border: 1px solid #aab4c0; }
        button { margin-top: 18px; background: #2057d4; color: white; border: 0; cursor: pointer; }
        .error { color: #c02331; font-size: 14px; }
    </style>
</head>
<body><main>
    <h1>주식 분석 시스템</h1>
    <form method="post">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <button type="submit">접속</button>
    </form>
</main></body>
</html>
